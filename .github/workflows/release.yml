name: Publish Release

on:
  push:
    tags:
      - 'v*' # Triggers only on tags like v1.0, v0.2-alpha, etc.

permissions:
  contents: write # Crucial: Gives permission to create the Release page

jobs:
  release-macos:
    name: Release macOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync

      - name: Build with PyInstaller
        run: |
          uv run pyinstaller --name Clarity --windowed --clean --noconfirm main.py

      - name: Create Zip Archive
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent Clarity.app Clarity.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/Clarity.zip
          generate_release_notes: true
          draft: false
          prerelease: false
